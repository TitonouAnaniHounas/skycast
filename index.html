<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>skycast</title>
  </head>
  <body class="bg-white text-gray-900 dark:bg-gray-900 dark:text-gray-100">

    <header class="sticky top-0 z-50 bg-white/90 dark:bg-gray-900/90 backdrop-blur border-b border-gray-200 dark:border-gray-800">
      <nav class="max-w-7xl mx-auto flex items-center justify-between px-8 py-5">
        <a href="index.html" class="text-3xl font-bold text-sky-600">☁️ SkyCast</a>

        <ul class="hidden md:flex items-center gap-x-10 text-lg font-medium">
          <li><a href="index.html" class="hover:text-sky-600">Accueil</a></li>
          <li><a href="favorites.html" class="hover:text-sky-600">Favoris</a></li>
          <li><a href="history.html" class="hover:text-sky-600">Historique</a></li>
          <li><a href="settings.html" class="hover:text-sky-600">Paramètres</a></li>
        </ul>

        <div class="flex items-center gap-6">
          <button id="theme-toggle" aria-label="Basculer le thème">
            <i data-lucide="moon" class="w-6 h-6 dark:hidden" id="moon-icon"></i>
            <i data-lucide="sun" class="w-6 h-6 hidden dark:block" id="sun-icon"></i>
          </button>
          <button id="menu-toggle" aria-label="Ouvrir le menu" aria-expanded="false" class="md:hidden">
            <i data-lucide="menu" class="w-7 h-7" id="menu-icon"></i>
            <i data-lucide="x" class="w-7 h-7 hidden" id="close-icon"></i>
          </button>
        </div>
      </nav>

      <ul id="mobile-menu" class="hidden md:hidden flex-col gap-3 px-8 pb-6 text-lg font-medium">
        <li><a href="index.html" class="block py-2">Accueil</a></li>
        <li><a href="favorites.html" class="block py-2">Favoris</a></li>
        <li><a href="history.html" class="block py-2">Historique</a></li>
        <li><a href="settings.html" class="block py-2">Paramètres</a></li>
      </ul>
    </header>

    <main>
      <section class="max-w-3xl mx-auto px-8 py-20 text-center">
        <h1 class="text-4xl font-bold mb-10">Consultez la météo de n'importe quelle ville</h1>

        <div class="relative mb-6">
          <input
            id="city-search-input"
            type="text"
            placeholder="Rechercher une ville..."
            class="w-full pl-6 pr-16 py-4 text-lg rounded-xl border border-gray-300 dark:border-gray-700 bg-white dark:bg-gray-800 focus:outline-none focus:ring-2 focus:ring-sky-600"
          />
          <button id="search-btn" aria-label="Rechercher" class="absolute right-4 top-1/2 -translate-y-1/2">
            <i data-lucide="search" class="w-6 h-6"></i>
          </button>

          <ul id="autocomplete-results" class="hidden absolute z-10 w-full bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-xl mt-2 shadow-lg text-left text-lg"></ul>
        </div>

        <button id="geolocation-btn" class="inline-flex items-center gap-2 text-base text-sky-600 hover:underline">
          <i data-lucide="map-pin" class="w-5 h-5"></i>
          Utiliser ma position
        </button>
      </section>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
