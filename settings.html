<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Paramètres — SkyCast</title>
  </head>
  <body class="text-gray-100">

    <div class="aurora-blob aurora-blob-1"></div>
    <div class="aurora-blob aurora-blob-2"></div>

    <div class="relative z-10">

      <header class="sticky top-0 z-50 bg-black/40 backdrop-blur-xl border-b border-white/10">
        <nav class="max-w-7xl mx-auto flex items-center justify-between px-8 py-5">
          <a href="index.html" class="text-3xl font-bold bg-gradient-to-r from-violet-400 to-emerald-400 bg-clip-text text-transparent">
            ☁️ SkyCast
          </a>
          <ul class="hidden md:flex items-center gap-x-10 text-lg font-medium">
            <li><a href="index.html" class="hover:text-violet-300 transition">Accueil</a></li>
            <li><a href="favorites.html" class="hover:text-violet-300 transition">Favoris</a></li>
            <li><a href="history.html" class="hover:text-violet-300 transition">Historique</a></li>
            <li><a href="settings.html" class="hover:text-violet-300 transition">Paramètres</a></li>
          </ul>
          <button id="menu-toggle" aria-label="Ouvrir le menu" aria-expanded="false" class="md:hidden">
            <i data-lucide="menu" class="w-7 h-7" id="menu-icon"></i>
            <i data-lucide="x" class="w-7 h-7 hidden" id="close-icon"></i>
          </button>
        </nav>
        <ul id="mobile-menu" class="hidden md:hidden flex-col gap-3 px-8 pb-6 text-lg font-medium">
          <li><a href="index.html" class="block py-2">Accueil</a></li>
          <li><a href="favorites.html" class="block py-2">Favoris</a></li>
          <li><a href="history.html" class="block py-2">Historique</a></li>
          <li><a href="settings.html" class="block py-2">Paramètres</a></li>
        </ul>
      </header>

      <main>
        <section class="max-w-2xl mx-auto px-8 py-12">
          <h1 class="text-2xl font-bold mb-8">Paramètres</h1>

          <div class="space-y-4">
            <div class="bg-white/5 border border-white/10 rounded-2xl p-6">
              <p class="text-sm text-gray-400 mb-3">Température</p>
              <div class="flex gap-2">
                <button data-group="temperature" data-value="celsius" class="unit-btn px-4 py-2 rounded-full text-sm font-medium border border-white/10">
                  Celsius
                </button>
                <button data-group="temperature" data-value="fahrenheit" class="unit-btn px-4 py-2 rounded-full text-sm font-medium border border-white/10">
                  Fahrenheit
                </button>
              </div>
            </div>

            <div class="bg-white/5 border border-white/10 rounded-2xl p-6">
              <p class="text-sm text-gray-400 mb-3">Vitesse du vent</p>
              <div class="flex gap-2">
                <button data-group="wind" data-value="kmh" class="unit-btn px-4 py-2 rounded-full text-sm font-medium border border-white/10">
                  km/h
                </button>
                <button data-group="wind" data-value="mph" class="unit-btn px-4 py-2 rounded-full text-sm font-medium border border-white/10">
                  mph
                </button>
              </div>
            </div>
          </div>
        </section>
      </main>

    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
